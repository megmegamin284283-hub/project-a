<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create new pass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style-pass.css">
</head>

<body>
    <div class="container">
        <div class="left-side">
            <h1>Welcome Back ❤️</h1>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Natus ab numquam hic, corrupti quibusdam
                mollitia sequi, odio voluptates tenetur quasi nostrum animi assumenda earum officiis odit dolores

        </div>
        <div class="right-side">
            <h2>Sign In 🔐</h2>
            <form action="###" method="get" target="_blank">
                <input type="password" name="new-password" required placeholder="New Password" maxlength="20"

                <input type="password" name=" repeated-password" required placeholder="Repeat Password" maxlength="20"

                <button type="submit">Save</button>

            </form>

        </div>
    </div>
</body>

</html>
